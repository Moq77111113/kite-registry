image: node:18-alpine

stages:
  - install
  - lint
  - test
  - build
  - deploy

variables:
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.npm"
  NODE_ENV: "production"

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm
    - node_modules

# Install dependencies
install:
  stage: install
  script:
    - npm ci --prefer-offline
  artifacts:
    paths:
      - node_modules
    expire_in: 1 hour

# Lint code
lint:
  stage: lint
  dependencies:
    - install
  script:
    - npm run lint
  allow_failure: false

# Run tests
test:unit:
  stage: test
  dependencies:
    - install
  script:
    - npm run test:unit
  coverage: '/Statements\s*:\s*([^%]+)/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml
    paths:
      - coverage/

test:integration:
  stage: test
  dependencies:
    - install
  services:
    - postgres:15-alpine
  variables:
    POSTGRES_DB: testdb
    POSTGRES_USER: testuser
    POSTGRES_PASSWORD: testpass
    DATABASE_URL: "postgres://testuser:testpass@postgres:5432/testdb"
  script:
    - npm run test:integration
  only:
    - merge_requests
    - main
    - develop

# Build application
build:
  stage: build
  dependencies:
    - install
  script:
    - npm run build
  artifacts:
    paths:
      - dist/
      - build/
    expire_in: 1 week
  only:
    - main
    - develop
    - tags

# Deploy to staging
deploy:staging:
  stage: deploy
  dependencies:
    - build
  script:
    - echo "Deploying to staging environment..."
    - npm run deploy:staging
  environment:
    name: staging
    url: https://staging.example.com
  only:
    - develop
  when: manual

# Deploy to production
deploy:production:
  stage: deploy
  dependencies:
    - build
  script:
    - echo "Deploying to production environment..."
    - npm run deploy:production
  environment:
    name: production
    url: https://example.com
  only:
    - main
    - tags
  when: manual
